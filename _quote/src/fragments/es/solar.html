<!-- the panel count and sections, one control shared by the home Solar tab, the solar demo and the pigeon demo -->
<div class="orow"><span>Tus paneles</span><div class="stepper" data-step="panels"><button type="button" data-d="-1" aria-label="Menos paneles">−</button><output class="num">16</output><button type="button" data-d="1" aria-label="Más paneles">+</button></div><b class="ptotal num" hidden></b></div>
<div class="orow"><span>Secciones</span><div class="seg2" data-seg="arrays"><button type="button" data-v="1" aria-pressed="true">1</button><button type="button" data-v="2" aria-pressed="false">2</button><button type="button" data-v="3" aria-pressed="false">3</button></div></div>
<div class="orow" data-sec="0" hidden><span>Sección 1</span><div class="stepper" data-step="arr0"><button type="button" data-d="-1" aria-label="Menos paneles en la sección 1">−</button><output class="num">8</output><button type="button" data-d="1" aria-label="Más paneles en la sección 1">+</button></div></div>
<div class="orow" data-sec="1" hidden><span>Sección 2</span><div class="stepper" data-step="arr1"><button type="button" data-d="-1" aria-label="Menos paneles en la sección 2">−</button><output class="num">8</output><button type="button" data-d="1" aria-label="Más paneles en la sección 2">+</button></div></div>
<div class="orow" data-sec="2" hidden><span>Sección 3</span><div class="stepper" data-step="arr2"><button type="button" data-d="-1" aria-label="Menos paneles en la sección 3">−</button><output class="num">8</output><button type="button" data-d="1" aria-label="Más paneles en la sección 3">+</button></div></div>
