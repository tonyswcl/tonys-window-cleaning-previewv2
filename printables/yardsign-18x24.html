<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Tony's Window Cleaning — Yard Sign 18×24</title>
<style>
  /* Stake it in the front lawn while you work, collect it when you leave.
     Every car and walker on that street sees who is doing the house.
     Trim 18 x 24", .125" bleed. UPrinting: Yard Signs, 4mm coroplast
     with H-stake, double-sided so it reads from both directions. */
  @import url('fonts/fonts.css');
  :root{--navy:#103050;--blue:#2f6fb0;--slate:#46617a;--gold:#c98b1e;
        --paper:#fbfdff;--pale:#eef5fb;--line:#cfe0ee;
        --font:'Plus Jakarta Sans',system-ui,sans-serif;--head:'Sora',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:18.25in 24.25in;margin:0}
  body{width:18.25in;height:24.25in;overflow:hidden;background:var(--paper);
       font-family:var(--font);color:var(--navy);
       display:flex;flex-direction:column;align-items:center;
       padding:1.5in 1.35in 1.45in;text-align:center}
  body>*{flex-shrink:0}
  img.mark{height:4.2in;width:auto}
  .l1{font-family:var(--head);font-weight:800;font-size:190px;line-height:1;margin-top:.34in}
  .l2{font-family:var(--head);font-weight:700;font-size:76px;letter-spacing:.085em;
      color:var(--slate);margin-top:.18in}
  .rule{width:11in;height:.085in;background:var(--gold);margin:.52in 0 .44in}
  .work{font-family:var(--head);font-weight:800;font-size:68px;line-height:1.3;color:var(--blue)}
  .ph{font-family:var(--head);font-weight:800;font-size:190px;line-height:1;margin-top:.46in}
  .st{font-size:60px;font-weight:700;color:var(--slate);margin-top:.22in}
  .qr{margin-top:.5in;background:#fff;border:.03in solid var(--line);
      border-radius:.22in;padding:.3in}
  .qr img{display:block;width:3.5in;height:3.5in;image-rendering:pixelated}
  .qrc{font-family:var(--head);font-weight:800;font-size:34px;letter-spacing:.06em;
       text-transform:uppercase;color:var(--blue);margin-top:.2in}
  .foot{margin-top:auto;width:100%;background:var(--pale);border-radius:.2in;
        padding:.34in .3in;font-family:var(--head);font-weight:700;
        font-size:38px;color:var(--navy);letter-spacing:.02em}
  .foot i{font-style:normal;color:var(--gold);margin:0 .35em}
</style></head>
<body>
  <img class="mark" src="assets/logo-tile.svg" alt="">
  <span class="l1">TONY'S</span>
  <span class="l2">WINDOW CLEANING</span>
  <div class="rule"></div>
  <span class="work">Another home cleaned<br>on this street today</span>
  <span class="ph">714-559-0300</span>
  <span class="st">twindowclean.com</span>
  <div class="qr"><img src="assets/qr-quote.png" alt=""></div>
  <span class="qrc">Scan for a free quote</span>
  <div class="foot">Windows<i>·</i>Solar<i>·</i>Pressure Washing</div>
</body></html>
