<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Tony's Window Cleaning — Referral Card front (3.5×2, UPrinting business card)</title>
<style>
  /* Standard business-card size so it prints as UPrinting's cheapest,
     most available product. Trim 3.5 x 2", .125" bleed per side.
     Light ground, navy as ink — no solid colour fields. */
  @import url('fonts/fonts.css');
  :root{--navy:#103050;--blue:#2f6fb0;--slate:#46617a;--gold:#c98b1e;
        --paper:#fbfdff;--line:#dbe8f3;
        --font:'Plus Jakarta Sans',system-ui,sans-serif;--head:'Sora',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:3.75in 2.25in;margin:0}
  body{width:3.75in;height:2.25in;overflow:hidden;background:var(--paper);
       font-family:var(--font);color:var(--navy);padding:.125in}
  .frame{width:100%;height:100%;border:1.2px solid var(--line);border-radius:.06in;
         display:flex;flex-direction:column;align-items:center;justify-content:center;
         padding:.14in;text-align:center}
  .frame>*{flex-shrink:0}
  .kick{font-size:6.5px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--blue)}
  .amt{font-family:var(--head);font-weight:800;font-size:52px;line-height:1;color:var(--gold);margin-top:.02in}
  .svc{font-family:var(--head);font-weight:800;font-size:11.5px;letter-spacing:.15em;
       text-transform:uppercase;margin-top:.02in}
  .rule{width:1.5in;height:.014in;background:var(--gold);margin:.1in 0 .09in;opacity:.85}
  .lock{display:flex;align-items:center;gap:.07in}
  .lock img{height:.3in;width:auto}
  .lock span{font-family:var(--head);font-weight:800;font-size:9.5px;letter-spacing:.03em}
  .tag{font-size:6.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
       color:var(--slate);margin-top:.07in}
</style></head>
<body><div class="frame">
  <span class="kick">Friends &amp; Neighbors</span>
  <span class="amt">$50</span>
  <span class="svc">Off Any Service</span>
  <div class="rule"></div>
  <div class="lock">
    <img src="assets/logo-tile.png" alt="">
    <span>TONY'S WINDOW CLEANING</span>
  </div>
  <span class="tag">Gift Certificate</span>
</div></body></html>
