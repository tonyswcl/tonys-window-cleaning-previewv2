<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tony's Window Cleaning — Tailgate White Lettering, RIGHT panel (contact)</title>
<style>
  /* Tailgate lettering, WHITE TEXT ONLY, transparent ground.
     RIGHT panel = the contact details. Pairs with
     decal-tailgate-white-left (the name). 20" x 8". */
  @import url('fonts/fonts.css');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:transparent}
  @page{size:20in 8in;margin:0}
  body{
    width:20in;height:8in;overflow:hidden;
    font-family:'Sora','Plus Jakarta Sans',sans-serif;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:.3in;
  }
  .kicker{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
      font-size:96px;line-height:1;letter-spacing:.34em;white-space:nowrap;opacity:.95}
  .phone{display:block;font-weight:800;font-size:235px;line-height:1.08;
      letter-spacing:.005em;white-space:nowrap;margin-top:.26in}
  .site{display:block;font-weight:700;font-size:148px;line-height:1.1;
      letter-spacing:.04em;white-space:nowrap;margin-top:.22in}
</style>
</head>
<body>
  <span class="kicker">CALL OR TEXT</span>
  <span class="phone">714-559-0300</span>
  <span class="site">twindowclean.com</span>
</body>
</html>
