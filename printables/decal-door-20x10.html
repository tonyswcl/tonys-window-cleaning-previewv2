<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tony's Window Cleaning — Front Door Decal 20×10 (white, transparent)</title>
<style>
  /* Front doors. White lettering on a TRANSPARENT ground so it reads as
     lettering on the paint, not a plate stuck to the door. Only the logo
     mark prints in colour. Order 2 (mirror-image placement, same art). */
  @import url('fonts/fonts.css');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:transparent}
  @page{size:20in 10in;margin:0}
  body{
    width:20in;height:10in;overflow:hidden;color:#fff;
    font-family:'Sora','Plus Jakarta Sans',sans-serif;
    display:flex;align-items:center;justify-content:center;gap:.62in;padding:.25in;
  }
  img{height:4.15in;width:auto;flex:0 0 auto}
  .stack{flex:0 0 auto;text-align:left}
  .l1{display:block;font-weight:800;font-size:275px;line-height:1;letter-spacing:.005em;white-space:nowrap}
  .l2{display:block;font-weight:700;font-size:107px;line-height:1.1;letter-spacing:.1em;
      white-space:nowrap;margin-top:.13in}
  .rule{height:.05in;background:#fff;margin:.22in 0 .2in;opacity:.95}
  .ph{display:block;font-weight:800;font-size:163px;line-height:1;white-space:nowrap}
  .st{display:block;font-weight:700;font-size:93px;line-height:1.1;letter-spacing:.05em;
      white-space:nowrap;margin-top:.17in}
</style>
</head>
<body>
  <img src="assets/logo-tile.png" alt="Tony's Window Cleaning">
  <div class="stack">
    <span class="l1">TONY'S</span>
    <span class="l2">WINDOW CLEANING</span>
    <div class="rule"></div>
    <span class="ph">714-559-0300</span>
    <span class="st">twindowclean.com</span>
  </div>
</body>
</html>
