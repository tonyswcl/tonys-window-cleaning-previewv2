<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tony's Window Cleaning — Side Door Magnet 24×12 light (full bleed 24.25×12.25)</title>
<style>
  /* =========================================================
     VistaPrint car magnet — trim 24" x 12", 0.125" bleed per
     side, page = 24.25" x 12.25". Order TWO.

     Light treatment: navy is used as INK, not as a field. A
     large navy panel next to carbonized-grey paint reads dark-
     on-dark and heavy; a soft, near-white ground with navy
     lettering separates cleanly from the paint and reads as a
     fitted plaque rather than a stuck-on advert.

     Content is deliberately sparse — mark, name, number, site.
     No service list, no review badge, no call to action.
     ========================================================= */
  @import url('fonts/fonts.css');

  :root{
    --ground:#f3f7fb;     /* soft brand-tinted off-white */
    --navy:#103050;
    --slate:#46617a;
    --gold:#e0992a;       /* brand gold, deeper value for light grounds */
    --keyline:#cbdded;
    --font:'Plus Jakarta Sans',system-ui,sans-serif;
    --head:'Sora','Plus Jakarta Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:24.25in 12.25in;margin:0}
  body{
    width:24.25in;height:12.25in;overflow:hidden;
    font-family:var(--font);color:var(--navy);
    background:var(--ground);
    padding:.95in;                 /* .125in bleed + .825in inside trim */
  }

  .plate{
    width:100%;height:100%;
    border:.055in solid var(--keyline);
    border-radius:.45in;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:.7in 1.1in;
  }
  .plate>*{flex-shrink:0}

  .lockup{display:flex;align-items:center;gap:.6in}
  .lockup img{height:3in;width:auto;flex:0 0 auto}
  .names{text-align:left}
  .names .l1{
    display:block;font-family:var(--head);font-weight:800;
    font-size:206px;line-height:1;color:var(--navy);
    letter-spacing:-.005em;white-space:nowrap;
  }
  .names .l2{
    display:block;font-family:var(--head);font-weight:700;
    font-size:107px;line-height:1.1;color:var(--slate);
    letter-spacing:.085em;white-space:nowrap;margin-top:.13in;
  }

  .rule{height:.05in;width:14in;background:var(--gold);margin:.5in 0 .46in;opacity:.9}

  .phone{
    display:block;font-family:var(--head);font-weight:800;
    font-size:228px;line-height:1;color:var(--navy);
    letter-spacing:-.005em;white-space:nowrap;
  }
  .site{
    display:block;font-family:var(--head);font-weight:700;
    font-size:98px;line-height:1.1;color:var(--slate);
    letter-spacing:.075em;white-space:nowrap;margin-top:.3in;
  }
</style>
</head>
<body>
  <div class="plate">
    <div class="lockup">
      <img src="assets/logo-tile.svg" alt="Tony's Window Cleaning">
      <div class="names">
        <span class="l1">TONY'S</span>
        <span class="l2">WINDOW CLEANING</span>
      </div>
    </div>

    <div class="rule"></div>

    <span class="phone">714-559-0300</span>
    <span class="site">twindowclean.com</span>
  </div>
</body>
</html>
