<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tony's Window Cleaning — Tailgate LEFT panel (logo + name)</title>
<style>
  /* Tailgate vinyl, piece 1 of 3. Logo mark + name.
     Goes LEFT of the Ford oval, above the MAVERICK stamping.
     White type on a transparent ground; the mark prints in colour. */
  @import url('fonts/fonts.css');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:transparent}
  @page{size:20in 8in;margin:0}
  body{
    width:20in;height:8in;overflow:hidden;
    font-family:'Sora','Plus Jakarta Sans',sans-serif;color:#fff;
    display:flex;align-items:center;justify-content:center;gap:.62in;
    padding:.3in;
  }
  img{height:4.05in;width:auto;flex:0 0 auto}
  .names{flex:0 0 auto;text-align:left}
  .l1{display:block;font-weight:800;font-size:330px;line-height:1;letter-spacing:.005em;white-space:nowrap}
  .l2{display:block;font-weight:700;font-size:105px;line-height:1.1;letter-spacing:.1em;
      white-space:nowrap;margin-top:.2in}
</style>
</head>
<body>
  <img src="assets/logo-icon.png" alt="Tony's Window Cleaning">
  <div class="names">
    <span class="l1">TONY'S</span>
    <span class="l2">WINDOW CLEANING</span>
  </div>
</body>
</html>
