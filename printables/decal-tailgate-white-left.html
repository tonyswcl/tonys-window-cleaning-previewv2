<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tony's Window Cleaning — Tailgate White Lettering, LEFT panel (name)</title>
<style>
  /* Tailgate lettering, WHITE TEXT ONLY, transparent ground.
     LEFT panel = the name. Pairs with decal-tailgate-white-right
     (the contact details) on the other side of the Ford oval.
     20" x 8". Order ONE of each — the two panels are different. */
  @import url('fonts/fonts.css');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:transparent}
  @page{size:20in 8in;margin:0}
  body{
    width:20in;height:8in;overflow:hidden;
    font-family:'Sora','Plus Jakarta Sans',sans-serif;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:.3in;
  }
  .l1{display:block;font-weight:800;font-size:430px;line-height:1;letter-spacing:.005em;white-space:nowrap}
  .l2{display:block;font-weight:700;font-size:148px;line-height:1.1;letter-spacing:.105em;
      white-space:nowrap;margin-top:.24in}
</style>
</head>
<body>
  <span class="l1">TONY'S</span>
  <span class="l2">WINDOW CLEANING</span>
</body>
</html>
