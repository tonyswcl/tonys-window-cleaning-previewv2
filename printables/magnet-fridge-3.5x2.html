<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Tony's Window Cleaning — Fridge Magnet 3.5×2</title>
<style>
  /* Business-card magnet. Goes in the goodie bag. Window cleaning is
     repeat work — this keeps the number in the kitchen, not a drawer.
     Trim 3.5 x 2", .125" bleed. UPrinting: Business Card Magnets. */
  @import url('fonts/fonts.css');
  :root{--navy:#103050;--blue:#2f6fb0;--slate:#46617a;--gold:#c98b1e;
        --paper:#fbfdff;--line:#dbe8f3;
        --font:'Plus Jakarta Sans',system-ui,sans-serif;--head:'Sora',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:3.75in 2.25in;margin:0}
  body{width:3.75in;height:2.25in;overflow:hidden;background:var(--paper);
       font-family:var(--font);color:var(--navy);
       display:flex;align-items:center;gap:.16in;padding:.26in .28in}
  body>*{flex-shrink:0}
  img{height:.78in;width:auto}
  .stack{flex:1 1 auto;min-width:0}
  .l1{display:block;font-family:var(--head);font-weight:800;font-size:19px;line-height:1}
  .l2{display:block;font-family:var(--head);font-weight:700;font-size:8px;
      letter-spacing:.13em;color:var(--slate);margin-top:.025in}
  .rule{height:.014in;background:var(--gold);margin:.07in 0 .06in;opacity:.85}
  .ph{display:block;font-family:var(--head);font-weight:800;font-size:20px;line-height:1}
  .sub{display:block;font-size:7.2px;font-weight:600;color:var(--slate);margin-top:.035in;line-height:1.4}
  .sub b{color:var(--blue);font-weight:800}
</style></head>
<body>
  <img src="assets/logo-tile.png" alt="">
  <div class="stack">
    <span class="l1">TONY'S</span>
    <span class="l2">WINDOW CLEANING</span>
    <div class="rule"></div>
    <span class="ph">714-559-0300</span>
    <span class="sub">twindowclean.com · <b>Most homes: every 4–6 months</b></span>
  </div>
</body></html>
